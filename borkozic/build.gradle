apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.borkozic'
    compileSdk 36

    defaultConfig {
        applicationId "com.borkozic"
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName "1.04"
    }

    signingConfigs {
        release {
            storeFile file("../borkozic-release.jks")
            storePassword "borkozic2026"
            keyAlias "borkozic"
            keyPassword "borkozic2026"
        }
    }

    buildTypes {
        debug {
            // Sign debug builds with the release key too
            // so update installs work without uninstall
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        compose = true
    }


    useLibrary 'org.apache.http.legacy'
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    }
}

dependencies {
    implementation project(':borkoziclib')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.jbundle.util.osgi.wrapped:org.jbundle.util.osgi.wrapped.org.apache.http.client:4.1.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // Compose — compatible with Kotlin 1.9.24 + compiler 1.5.14
    implementation 'androidx.compose.ui:ui:1.11.2'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.compose.runtime:runtime-livedata:1.11.2'

    // Compose AndroidX integration
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'

    // Navigation Compose
    implementation 'androidx.navigation:navigation-compose:2.9.8'

}